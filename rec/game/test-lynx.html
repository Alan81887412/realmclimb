<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body><script type="module">

  mk(480, new THREE.MeshStandardMaterial({ color: 0x5f8a3c, roughness: 1 }), 0); mk(80, new THREE.MeshBasicMaterial({ color: 0x4c7030, wireframe: true }), 0.004).receiveShadow = false;
  window.__gnd = HG; if (X.T.setGround) X.T.setGround(HG); beast.position.y = HG(beast.position.x, beast.position.z); beast.rotation.order = 'YXZ'; }

  const h0 = HG(x, z); beast.position.y = h0; if (!TILT) return; const hf = HG(x + sy * Lf, z + cy * Lf), hb = HG(x - sy * Lf, z - cy * Lf), hl = HG(x + cy * Ws, z - sy * Ws), hr = HG(x - cy * Ws, z + sy * Ws);
  const tx = cl(-Math.atan2(hf - hb, 2 * Lf), -0.45, 0.45), tz = cl(Math.atan2(hl - hr, 2 * Ws), -0.35, 0.35), ty = cl(((hf + hb) / 2 - h0) / sc, -0.25, 0.25) * 0.6, ks = snap ? 1 : 1 - Math.exp(-7 * dt);
  SL[0] += (tx - SL[0]) * ks; SL[1] += (tz - SL[1]) * ks; SL[2] += (ty - SL[2]) * ks; tilt.rotation.set(SL[0], 0, SL[1]); tilt.position.y = SL[2]; };

window.__marks = () => { if (!MK.on) return; const sW = beast.scale.x * X.stage.scale.x; X.LEGS.forEach((L, i) => { L.t.getWorldPosition(MK.v); const g = window.__gnd ? window.__gnd(MK.v.x, MK.v.z) : 0, down = MK.v.y - g < (L.P0[4].y + 0.012) * sW;
  if (down && !MK.was[i]) { const m = new THREE.Mesh(MK.geo, MK.mat); m.position.set(MK.v.x, g + 0.008, MK.v.z); m.renderOrder = 2; scene.add(m); MK.list.push(m); if (MK.list.length > 60) scene.remove(MK.list.shift()); } MK.was[i] = down ? 1 : 0; }); };
window.__step = (o) => { try { const sp = o.speed || 0; beast.rotation.y += (o.turn || 0) * o.dt; const hy = beast.rotation.y; const ws_ = beast.scale.x * X.stage.scale.x, hm = hy + (o.mdir || 0);      /* mdir＝移動方向和面向差幾度（弧度）：模擬遊戲裡「身體還沒轉過去就被帶走」 */ beast.position.x += Math.sin(hm) * sp * ws_ * o.dt; beast.position.z += Math.cos(hm) * sp * ws_ * o.dt; window.__place(o.dt, false); beast.updateMatrixWorld(true); X.update(o); window.__marks(); } catch (e) { window.__errs.push(String(e && e.stack || e)); } return X.mode; };
window.__render = (view, D = 3.0) => { const dead = X.mode === 'dead' && X.RG.S.on, p = window.__camFix ? window.__camFix : dead ? X.stage.localToWorld(X.RG.T.c.clone()).setY(0) : beast.position, ly = dead ? 0.7 - 0.3 * Math.min(1, X.RG.S.t / 0.9) : 0.7, fy = window.__camYaw == null ? 0.6 : window.__camYaw, fw = new THREE.Vector3(Math.sin(fy), 0, Math.cos(fy)), rt = new THREE.Vector3(Math.cos(fy), 0, -Math.sin(fy));
  const dir = view === 'side' ? rt : rt.clone().add(fw).normalize(); cam.position.copy(p).addScaledVector(dir, D); cam.position.y = window.__camY == null ? 1.5 : window.__camY; cam.lookAt(p.x, window.__camLY == null ? ly : window.__camLY, p.z); sun.position.set(p.x - 6, 12, p.z + 5); sun.target.position.copy(p); sun.target.updateMatrixWorld();
  r.render(scene, cam); return r.domElement.toDataURL('image/jpeg', 0.9); };
